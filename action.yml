name: 'Lenscheck Semantic Review'
description: 'Semantic diff of a PR — what changed, where to look, and whether it breaks your rules'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  api_key:
    description: 'Your Lenscheck API key (request beta access). Store it as a repo secret.'
    required: true
  api_url:
    description: 'Lenscheck API base URL (only set this if you self-host the cloud)'
    required: false
    default: 'https://api.lenscheck.dev'
  github_token:
    description: 'GitHub token (for PR data + posting the comment)'
    required: true
    default: ${{ github.token }}
  comment:
    description: 'Post the review as a sticky PR comment (true/false)'
    required: false
    default: 'true'
  inline:
    description: 'Also pin each finding as an inline review comment on the changed line (true/false)'
    required: false
    default: 'true'
  label:
    description: 'Apply one lenscheck:* triage label for the PR top severity (true/false; needs issues: write)'
    required: false
    default: 'true'
outputs:
  review_markdown:
    description: 'Path to the generated markdown review'
    value: 'pr_review.md'
runs:
  using: 'composite'
  steps:
    - name: Check out the repo (full history, so base..head resolves)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Lenscheck (thin client — extraction runs here, ranking in the cloud)
      shell: bash
      run: pip install "lenscheck-semantic-reviewer>=1.0.0"

    - name: Run Lenscheck review
      shell: bash
      env:
        LENSCHECK_API_KEY: ${{ inputs.api_key }}
        LENSCHECK_API_URL: ${{ inputs.api_url }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        lenscheck review . \
          --base "origin/${GITHUB_BASE_REF}" --head "${GITHUB_SHA}" \
          --pr "${{ github.event.pull_request.number }}" \
          --out pr_review.md --json pr_review.json

    - name: Post sticky PR comment
      if: ${{ always() && inputs.comment == 'true' && hashFiles('pr_review.md') != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        POST_ARGS="${{ github.event.pull_request.number }} pr_review.md"
        EXTRA=""
        if [ "${{ inputs.inline }}" = "true" ]; then EXTRA="$EXTRA --inline"; fi
        if [ "${{ inputs.label }}" = "true" ]; then EXTRA="$EXTRA --label"; fi
        if [ -n "$EXTRA" ] && [ -f pr_review.json ]; then
          POST_ARGS="$POST_ARGS --json pr_review.json$EXTRA"
        fi
        python "${GITHUB_ACTION_PATH}/ci/post_review.py" $POST_ARGS \
          || echo "::warning::could not post comment — ensure the job has 'permissions: pull-requests: write, issues: write'"
