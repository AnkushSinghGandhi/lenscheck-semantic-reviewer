name: extractor tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout prism
        uses: actions/checkout@v4

      - name: checkout extractor tests
        uses: actions/checkout@v4
        with:
          repository: AnkushSinghGandhi/lenscheck-extractor-tests
          path: _tests

      - name: copy extractor to test dir
        run: cp -r extractor _tests/extractor

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install pytest
        run: pip install pytest

      - name: run tests
        run: cd _tests && pytest
