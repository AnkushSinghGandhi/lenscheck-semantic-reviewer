name: tests
on:
  push:
  pull_request:

jobs:
  pytest:
    # ubuntu-latest (26.04) has no Python 3.9 build; 3.9 is still supported, so test it on 24.04
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest (Lenscheck itself has no runtime deps)
        run: pip install pytest
      - name: Run tests
        run: pytest
