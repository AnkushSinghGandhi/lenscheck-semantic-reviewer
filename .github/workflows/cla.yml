name: CLA

# Gate code contributions on a signed Contributor License Agreement (see CLA.md).
# Contributors sign once by commenting on their first PR; signatures are stored in
# signatures/cla.json on the main branch.
#
# One-time setup: create a Personal Access Token (classic, `repo` scope, or a fine-grained
# token with Contents read/write on this repo) and add it as the repo secret
# CLA_SIGNATURES_TOKEN. The default GITHUB_TOKEN can't push the signatures file on its own.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/AnkushSinghGandhi/lenscheck-semantic-reviewer/blob/main/CLA.md'
          branch: 'main'
          allowlist: AnkushSinghGandhi,dependabot[bot]
          custom-notsigned-prcomment: 'Thanks for your pull request! Before we can merge code, please read our [Contributor License Agreement](https://github.com/AnkushSinghGandhi/lenscheck-semantic-reviewer/blob/main/CLA.md) and sign it by posting the exact comment below. You only ever sign once.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA. Thank you!'
