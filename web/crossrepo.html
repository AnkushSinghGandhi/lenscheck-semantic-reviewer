<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenscheck — Cross-repo</title>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("lenscheck.theme")||"dark")}catch(e){}</script>
<style>
:root{--bg:#0a0d13;--panel:#141922;--sidebar:#0d1119;--card:#11151d;--line:#232a36;
  --fg:#e6edf3;--mut:#8b93a3;--faint:#5b6473;
  --crit:#f85149;--high:#db8f2b;--med:#d0b429;--low:#3fb950;--link:#7aa2ff;--purple:#bc8cff;
  --acc:#7c74f0;--acc2:#6d64f5;}
[data-theme="light"]{--bg:#f5f6f9;--panel:#ffffff;--sidebar:#eef0f4;--card:#ffffff;--line:#e2e5ec;
  --fg:#1b2130;--mut:#5b6572;--faint:#98a1ad;
  --crit:#d1242f;--high:#b06a00;--med:#8a7200;--low:#1a7f37;--link:#2f5bd8;--purple:#7c3aed;
  --acc:#6d64f5;--acc2:#5a50e8;}
[data-theme="light"] .controls{background:#f5f6f9ee}
[data-theme="light"] .app>summary:hover{background:rgba(0,0,0,.03)}
[data-theme="light"] .tag.open,[data-theme="light"] .tag.write,[data-theme="light"] .tag.pii{color:#b42318;border-color:#f0c2be;background:rgba(209,36,47,.06)}
[data-theme="light"] .why{color:#b42318}
[data-theme="light"] .fact,[data-theme="light"] .snc{color:#374151}
[data-theme="light"] svg .elabel{fill:#6b7280}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---- top nav (matches the review UI) ---- */
nav.top{display:flex;align-items:center;gap:14px;height:54px;padding:0 18px;
  border-bottom:1px solid var(--line);background:var(--sidebar);position:sticky;top:0;z-index:10}
nav.top .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px}
nav.top .brand .lens{font-size:17px}
  nav.top .brand img.lensmark{height:26px;width:auto;display:block}
nav.top .brand .g{background:linear-gradient(90deg,var(--acc),var(--purple),var(--link));
  -webkit-background-clip:text;background-clip:text;color:transparent}
nav.top small{color:var(--mut);font-weight:400;font-size:12.5px}
nav.top .spacer{flex:1}
nav.top .navbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:12.5px;font-weight:600;
  cursor:pointer;transition:border-color .15s,transform .15s}
nav.top .navbtn:hover{transform:translateY(-1px);border-color:var(--acc);text-decoration:none}
nav.top .navbtn.on{border-color:var(--acc);color:#fff;background:rgba(124,116,240,.14)}
nav.top .sep{width:1px;height:26px;background:var(--line)}
nav.top .who{font-size:12px;color:var(--mut)}nav.top .who a{font-weight:600}
nav.top .domain{display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,Menlo,monospace;
  font-size:11.5px;color:var(--mut);padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
nav.top .domain:hover{border-color:var(--acc);color:var(--fg);text-decoration:none}
nav.top .domain b{color:var(--acc);font-weight:700}

/* ---- controls bar ---- */
.controls{position:sticky;top:54px;background:#0a0d13ee;backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:12px 20px;z-index:5}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input,select,button{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;
  padding:8px 11px;font-size:13px;font-family:inherit}
input.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
#repo{min-width:320px}#q{min-width:240px;flex:1;max-width:420px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.primary{font-weight:700;color:#fff;background:linear-gradient(180deg,var(--acc),var(--acc2));border-color:transparent}
button.primary:hover{filter:brightness(1.08)}
.seed{margin-left:auto;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);border-radius:2em;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--mut)}
.chip:hover{border-color:var(--acc)}
.chip.on{background:rgba(124,116,240,.16);color:#fff;border-color:var(--acc)}

.wrap{max-width:1180px;margin:0 auto;padding:16px 20px 60px}
textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:8px;
  padding:9px 11px;font:12.5px ui-monospace,Menlo,monospace;resize:vertical}
#schema{width:100%;margin-top:8px}
.crow2{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--mut);font-size:12.5px;cursor:pointer}
#status{color:var(--mut);font-size:12.5px}
.legend{color:var(--mut);font-size:12.5px;margin:4px 0 12px;line-height:1.7}.legend b{color:var(--fg)}
.toolbar{position:sticky;top:54px;background:var(--bg);padding:10px 0;margin-bottom:12px;
  border-bottom:1px solid var(--line);z-index:4}
#q{width:100%;max-width:none}
.chip input{margin:0 5px 0 0;vertical-align:middle}
.klbl{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;align-self:center;margin-right:2px}
.chips select{font-size:12.5px;padding:3px 8px;border-radius:2em}
#branches input{width:260px;font-size:12px;padding:2px 8px;margin-left:4px}
.chip.mw{border-color:rgba(248,81,73,.45)}.chip.pc{border-color:rgba(219,143,43,.45)}
.btn{font-size:12.5px;color:var(--link);background:none;border:none;padding:0 6px;cursor:pointer}
#count{margin-left:auto;color:var(--mut);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:10px;
  margin-bottom:8px;overflow:hidden}
.card[data-kind=multi_writer]{border-left-color:var(--crit)}.card[data-kind=producer_consumer]{border-left-color:var(--high)}
.card>summary{cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;list-style:none;font-size:13px}
.card>summary::-webkit-details-marker{display:none}.card>summary:hover{background:rgba(255,255,255,.03)}
[data-theme="light"] .card>summary:hover{background:rgba(0,0,0,.03)}
.card code,.links code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}.card>summary code{font-weight:700}
.meta{color:var(--mut);font-size:12px;margin-left:auto}
.body{padding:6px 14px 14px;border-top:1px solid var(--line)}
.repos{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.repo{flex:1;min-width:280px;border-left:3px solid var(--line);padding-left:10px}.repo.absent{opacity:.45}
.rw{margin:5px 0}.w{color:var(--crit);font-weight:700;font-size:11px}.r{color:var(--link);font-weight:700;font-size:11px}
ul{margin:3px 0;padding-left:16px}li{font-size:12.5px}
.h{color:var(--mut)}.loc{color:var(--faint);font-size:11.5px}.none{color:var(--faint)}.more{color:var(--faint);list-style:none}
.badge{display:inline-block;padding:1px 8px;border-radius:5px;font-size:11px;font-weight:700;
  background:rgba(124,116,240,.14);color:var(--acc)}
.badge.red{background:rgba(248,81,73,.14);color:var(--crit)}.badge.amber{background:rgba(219,143,43,.14);color:var(--high)}
.badge.green{background:rgba(63,185,80,.14);color:var(--low)}
.coord{color:var(--crit);font-weight:600;font-size:12.5px;margin:4px 0 8px}
#empty{display:none;color:var(--mut);padding:30px;text-align:center}
h2{font-size:15px;margin:26px 0 4px}
.links{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 26px}.links li{margin:5px 0}
</style></head>

<script>
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);
  const b=document.getElementById("themeBtn"); if(b) b.textContent=t==="light"?"🌙":"☀";
  try{localStorage.setItem("lenscheck.theme",t)}catch(e){}}
function toggleTheme(){applyTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light");}
applyTheme(document.documentElement.getAttribute("data-theme")||"dark");
var Q=new URLSearchParams(location.search), TOKEN=Q.get("token")||"";
var BADGE={multi_writer:["badge red","cross-service multi-writer","x-multi-writer"],producer_consumer:["badge amber","producer → consumer","x-producer-consumer"],read_only:["badge","read-only shared","x-read-only"]};
var GK_ENT={http:"ent-http",task:"ent-task",command:"ent-command",signal:"ent-signal"};   // glossary keys
var ORDER={multi_writer:0,producer_consumer:1,read_only:2};
var DATA=null, cards=[], links=[];
var ENTRY=[["http","🌐 api"],["task","⏱ task"],["command","⌘ command"],["signal","⚡ signal"]];
function entOf(route){var m=/^(task|command|signal):/.exec(route||"");return m?m[1]:"http";}
function allEps(s){var out=[];DATA.repos.forEach(function(rp){var a=s.by_repo[rp];if(a)out=out.concat(a.written_by||[],a.read_by||[]);});return out;}
function checked(sel){var on={};[].slice.call(document.querySelectorAll(sel)).forEach(function(k){on[k.value]=k.checked;});return on;}
function $(id){return document.getElementById(id);}
function esc(s){return (s==null?"":""+s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function repoList(){return $("repos").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);}
// "path@branch" → [path, branch]. Only a local path takes a branch (git refs never contain ":"), so
// "git@github.com:org/x" stays one repo.
function splitSpec(l){var i=l.lastIndexOf("@");return (i>0&&/^[\/~.]/.test(l)&&l.slice(i+1).indexOf(":")<0)?[l.slice(0,i),l.slice(i+1)]:[l,""];}
function navLinks(){   // carry the token, and open the map on the first repo (and its branch)
  var t=TOKEN?"token="+encodeURIComponent(TOKEN):"", r=repoList()[0], p=r?splitSpec(r):["",""];
  var qs=[p[0]?"repo="+encodeURIComponent(p[0]):"",p[1]?"ref="+encodeURIComponent(p[1]):"",t].filter(Boolean).join("&");
  $("navReview").href="./"+(t?"?"+t:"");
  $("navMap").href="map"+(qs?"?"+qs:"");
}
var REFS={};   // repo path → /api/refs reply, fetched once per path
function refsOf(repo,cb){
  if(REFS[repo])return cb(REFS[repo]);
  fetch("api/refs?repo="+encodeURIComponent(repo)+(TOKEN?"&token="+encodeURIComponent(TOKEN):""))
   .then(function(r){return r.json();}).then(function(d){REFS[repo]=d.error?{branches:[]}:d;cb(REFS[repo]);})
   .catch(function(){cb({branches:[]});});}
// one type-to-filter branch picker per repo line (big repos have 1000+ branches); picking rewrites that
// line as path@branch, empty = the working tree
function renderBranches(){
  var lines=repoList(), el=$("branches");
  el.innerHTML=lines.length?'<span class="klbl" data-g="branch-pick">branch</span>'+lines.map(function(l,i){var p=splitSpec(l);
   return '<label class="chip" data-g="branch-pick">'+esc(p[0].replace(/\/+$/,"").split("/").pop())+' <input class="mono" data-i="'+i+'" list="refs-'+i
    +'" value="'+esc(p[1])+'" placeholder="working tree"><datalist id="refs-'+i+'"></datalist></label>';}).join(""):"";
  lines.forEach(function(l,i){refsOf(splitSpec(l)[0],function(d){
   var inp=el.querySelector('input[data-i="'+i+'"]'); if(!inp)return;
   if(d.current)inp.placeholder="working tree ("+d.current+")";
   $("refs-"+i).innerHTML=(d.branches||[]).map(function(b){return '<option value="'+esc(b)+'">';}).join("");});});}
$("branches").addEventListener("change",function(ev){
  var i=+ev.target.getAttribute("data-i"), lines=repoList(), p=splitSpec(lines[i]), b=ev.target.value.trim();
  lines[i]=p[0]+(b?"@"+b:""); $("repos").value=lines.join("\n"); navLinks();});
function eps(lst){if(!lst||!lst.length)return '<span class="none">—</span>';
 var r=lst.slice(0,6).map(function(e){return '<li><code data-g="'+GK_ENT[entOf(e.route)]+'">'+esc(e.route)+'</code> <span class="h">'+esc(e.handler)+'</span> <span class="loc">'+esc(e.loc)+'</span></li>';}).join("");
 if(lst.length>6)r+='<li class="more">+'+(lst.length-6)+' more</li>';return '<ul>'+r+'</ul>';}
function cardHtml(s){
 var per=DATA.repos.map(function(rp){var a=s.by_repo[rp];
  if(!a)return '<div class="repo absent"><b>'+esc(rp)+'</b> <span class="none" data-g="x-not-touched">not touched</span></div>';
  return '<div class="repo"><b>'+esc(rp)+'</b><div class="rw"><span class="w" data-g="x-writes">WRITES</span> '+eps(a.written_by)+'</div><div class="rw"><span class="r" data-g="x-reads">READS</span> '+eps(a.read_by)+'</div></div>';}).join("");
 var b=BADGE[s.kind], uk=(s.unique_keys||[]), ukh="";
 if(uk.length){var keys=esc(uk.map(function(k){return k.join("+");}).join("; "));
  ukh=(s.kind==="multi_writer")?'<div class="coord" data-g="x-coordinate">⚠ coordinate on unique key <code>'+keys+'</code> — both writers must agree</div>'
                               :'<div class="meta" style="margin:4px 0 8px" data-g="x-unique-key">unique key: <code>'+keys+'</code></div>';}
 return '<details class="card" data-kind="'+s.kind+'" data-table="'+esc(s.table.toLowerCase())+'"><summary><code>'+esc(s.table)+'</code> <span class="'+b[0]+'" data-g="'+b[2]+'">'+b[1]+'</span><span class="meta" data-g="x-writers">writers: '+(esc(s.writers.join(", "))||"—")+'</span></summary><div class="body">'+ukh+'<div class="repos">'+per+'</div></div></details>';}
function renderApiLinks(){
 var all=DATA.api_links||[], el=$("apilinks");
 if(!all.length){el.innerHTML="";links=[];return;}
 var nExact=all.filter(function(l){return l.match==="exact";}).length;
 var rows=all.map(function(l){var k=entOf(l.from.route);return '<li>'+(l.match==="exact"?'<span class="badge green" data-g="x-exact">exact</span>':'<span class="badge amber" data-g="x-tail">tail · verify</span>')
  +' <b>'+esc(l.from_repo)+'</b> '+(k!=="http"?'<span class="badge" data-g="'+GK_ENT[k]+'">'+k+'</span> ':'')+'<code>'+esc(l.from.handler)+'</code> <span class="loc">'+esc(l.from.loc)+'</span> → call <code>'+esc(l.call)
  +'</code> → <b>'+esc(l.to_repo)+'</b> <code>'+esc(l.to.handler)+'</code> <span class="h">'+esc(l.to.route)+'</span> <span class="loc">'+esc(l.to.loc)+'</span></li>';}).join("");
 el.innerHTML='<h2 data-g="x-api-calls">Cross-repo API calls (<span id="lcount">'+all.length+'</span>)</h2>'
  +'<p class="legend"><b data-g="x-exact">exact</b> ('+nExact+'): the call path is the endpoint\'s full include()-chained route — trustworthy. · '
  +'<b data-g="x-tail">tail</b> ('+(all.length-nExact)+'): matched on a leaf route or with an extra prefix (e.g. a proxy mount) — <b>verify</b>.</p>'
  +'<div class="chips" style="margin-bottom:8px"><label class="chip" data-g="x-exact"><input type="checkbox" class="lf" value="exact" checked>exact ('+nExact+')</label>'
  +'<label class="chip" data-g="x-tail"><input type="checkbox" class="lf" value="tail" checked>tail ('+(all.length-nExact)+')</label></div>'
  +'<ul class="links">'+rows+'</ul>';
 var lis=el.querySelectorAll("ul.links li");
 links=all.map(function(l,i){return {el:lis[i], match:l.match, ent:entOf(l.from.route),
  hay:[l.from_repo,l.from.route,l.from.handler,l.from.loc,l.call,l.to_repo,l.to.route,l.to.handler,l.to.loc].join(" ").toLowerCase()};});}
function renderEntChips(){
 var n={}; cards.forEach(function(c){Object.keys(c.ents).forEach(function(k){n[k]=(n[k]||0)+1;});});
 // only worth a row when jobs touch shared tables (all-api data needs no entrypoint filter)
 if(!ENTRY.some(function(e){return e[0]!=="http"&&n[e[0]];})){$("entchips").innerHTML="";return;}
 $("entchips").innerHTML='<span class="klbl" data-g="entrypoint">entrypoint</span>'+ENTRY.filter(function(e){return n[e[0]];}).map(function(e){
  return '<label class="chip" data-g="'+GK_ENT[e[0]]+'"><input type="checkbox" class="ef" value="'+e[0]+'" checked>'+e[1]+' ('+n[e[0]]+')</label>';}).join("");}
function render(){
 var st=DATA.shared_tables.slice().sort(function(a,b){return (ORDER[a.kind]-ORDER[b.kind])||(a.table<b.table?-1:1);});
 $("list").innerHTML=st.map(cardHtml).join("");
 var els=document.querySelectorAll(".card");
 cards=st.map(function(s,i){var all=allEps(s), ents={};all.forEach(function(e){ents[entOf(e.route)]=1;});
  return {el:els[i], s:s, ents:ents, hay:(s.table+" "+all.map(function(e){return e.route+" "+e.handler+" "+e.loc;}).join(" ")).toLowerCase()};});
 renderEntChips(); renderApiLinks();
 $("wrepo").innerHTML='<option value="">written by: any repo</option>'+DATA.repos.map(function(r){return '<option value="'+esc(r)+'">written by: '+esc(r)+'</option>';}).join("");
 var su=DATA.summary;
 $("c-mw").textContent="("+su.multi_writer+")"; $("c-pc").textContent="("+su.producer_consumer+")"; $("c-ro").textContent="("+su.read_only+")";
 $("results").style.display=""; apply();}
function apply(){
 var term=$("q").value.trim().toLowerCase(), kinds=checked(".kf"), ents=checked(".ef"), lm=checked(".lf"),
     wr=$("wrepo").value, uk=$("ukonly").checked;
 // an unrendered entrypoint row means "no filter"; a table passes if ANY of its endpoints is a picked kind
 var entOk=function(e){return !document.querySelector(".ef")||Object.keys(e).some(function(k){return ents[k];});};
 var n=0; cards.forEach(function(c){var s=c.s;
  var ok=kinds[s.kind]&&(!term||c.hay.indexOf(term)>=0)&&entOk(c.ents)
   &&(!wr||s.writers.indexOf(wr)>=0)&&(!uk||(s.unique_keys||[]).length>0);
  c.el.style.display=ok?"":"none";if(ok)n++;});
 $("count").textContent=n+" shown"; $("empty").style.display=n?"none":"block";
 // say WHAT was searched: a name missing here is often just not on the branch that was analyzed
 $("empty").innerHTML=term?'no shared table touches <code>'+esc(term)+'</code> on <b>'+esc(DATA.repos.join(" · "))
  +'</b> — it may not exist on that branch, or it only uses tables one repo touches (try the Repo Map)':"no tables match";
 var m=0; links.forEach(function(l){var o={};o[l.ent]=1;
  var ok=lm[l.match]&&(!term||l.hay.indexOf(term)>=0)&&entOk(o);l.el.style.display=ok?"":"none";if(ok)m++;});
 if($("lcount"))$("lcount").textContent=m===links.length?m:m+" of "+links.length;}
$("q").addEventListener("input",apply);
[].slice.call(document.querySelectorAll(".kf")).forEach(function(k){k.addEventListener("change",apply);});
["ukonly","wrepo","entchips","apilinks"].forEach(function(id){$(id).addEventListener("change",apply);});
$("expand").addEventListener("click",function(){cards.forEach(function(c){if(c.el.style.display!=="none")c.el.open=true;});});
$("collapse").addEventListener("click",function(){cards.forEach(function(c){c.el.open=false;});});
$("repos").addEventListener("input",navLinks);
$("repos").addEventListener("change",renderBranches);
$("run").addEventListener("click",function(){
 var repos=repoList();
 if(repos.length<2){$("status").textContent="need at least 2 repos";return;}
 var schema=$("schema").value.trim();
 $("status").textContent="analyzing… (runs the extractor per repo, may take a bit)";
 var url="api/crossrepo?repos="+encodeURIComponent(repos.join(","))+"&writes_only="+($("wonly").checked?"1":"0")
   +(schema?"&schema="+encodeURIComponent(schema):"")+(TOKEN?"&token="+encodeURIComponent(TOKEN):"");
 fetch(url).then(function(r){return r.json();}).then(function(d){
  if(d.error){$("status").textContent="error: "+d.error;return;}
  DATA=d; $("status").textContent=d.repos.join(" · ")+" — "+d.summary.shared_tables+" tables · "+(d.summary.api_links||0)+" API links"; render();
 }).catch(function(e){$("status").textContent="failed: "+e;});
});
var pre=Q.get("repos"); if(pre){$("repos").value=pre.split(",").join("\n");}
navLinks(); renderBranches();
</script>
</body></html>
